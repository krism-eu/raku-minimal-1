name: Build and Publish RakuOS Minimal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Buildah
        run: |
          sudo apt-get update
          sudo apt-get -y install buildah

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image with Squash
        run: |
          buildah bud --squash -t ghcr.io/krism-eu/raku-minimal-1:latest -f Containerfile .

      - name: Push image to GHCR
        run: |
          buildah push ghcr.io/krism-eu/raku-minimal-1:latest docker://ghcr.io/krism-eu/raku-minimal-1:latest
