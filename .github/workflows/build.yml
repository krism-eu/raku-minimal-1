name: Build and Publish RakuOS Minimal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the image with Podman
        run: |
          podman build -f Containerfile -t ghcr.io/krism-eu/raku-minimal-1:latest .

      - name: Push the image to GHCR
        run: |
          podman push ghcr.io/krism-eu/raku-minimal-1:latest
